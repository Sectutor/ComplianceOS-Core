[build]
  base = "."
  command = "npm ci --legacy-peer-deps && npm run build -w @complianceos/core"
  publish = "packages/core/dist"

[build.environment]
  NPM_FLAGS = "--include=dev"
  NODE_OPTIONS = "--max-old-space-size=4096"
  PYTHON_VERSION = "3.12"
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_PATHS = ".netlify,node_modules,packages/core/dist,packages/core/tmp_build"
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_ANON_KEY,VITE_SUPABASE_URL"

[functions]

[functions.node_bundle]
  external_node_modules = ["postgres", "pdf-parse", "puppeteer", "docx", "archiver", "xlsx", "turndown", "openai"]

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api/health"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
